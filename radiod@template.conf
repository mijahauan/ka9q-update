# Generic minimal RX888 config - TEMPLATE
# Copy this file to /etc/radio/radiod@<YOUR_INSTANCE_NAME>.conf and edit as needed.

[global]
hardware = rx888 # use built-in rx888 driver, configured in [rx888]
status = YOUR_STATUS_HOST.local       # DNS name for receiver status and commands (e.g., myradio-status.local)
samprate = 24000        # default output sample rate
mode = usb 		# default receive mode
# rest are defaults
ttl = 1
#ttl = 0          # many sites lack IGMP-aware ethernet swtiches, so don't send radiod multicast packets out the ethernet port.
fft-threads = 1
# iface = YOUR_INTERFACE_NAME # e.g., eth0, enp1s0

[rx888]
device = "rx888" # required so it won't be seen as a demod section
description = "YOUR_CALLSIGN @ YOUR_GRID YOUR_ANTENNA" # good to put callsign and antenna description in here
# gain = 0 # dB
samprate = 129600000     # Hz
#samprate =   64800000     

[HF MANUAL]
data = YOUR_HF_PCM_HOST.local # e.g., myradio-hf-pcm.local
freq = 0
